name: App Mac

# Lancement à la main (onglet Actions > App Mac > Run workflow) ou à chaque tag v*.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14 # puce Apple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Construire Derush.app et le .dmg
        run: ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Derush-mac
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
