[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/mcp", "app/src-tauri"]
default-members = ["crates/core", "crates/cli", "crates/mcp", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
